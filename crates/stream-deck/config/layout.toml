
# Stream Deck レイアウト設定 (新スキーマ)

[app]
home = "home"

[dashboard]

[[dashboard.sections]]
type = "cpu"
capacity = 10

[[dashboard.sections]]
type = "mem"
capacity = 30

[[dashboard.sections]]
type = "load"
capacity = 30

[[dashboard.sections]]
type = "notif"
capacity = 12

[[pages]]
id = "home"
title = "Home"

[[pages.items]]
kind = "nav"
label = "Apps"
target = "apps"

[[pages.items]]
kind = "nav"
label = "Podman"
target = "podman"

[[pages]]
id = "apps"
title = "Apps"

# サブページで左上に戻る操作を置きたい場合は、back を先頭に定義する。
[[pages.items]]
kind = "back"
label = "Back"

[[pages.items]]
kind = "command"
label = "Terminal"
command = ["/usr/bin/terminator"]

[dynamic.podman]
enabled = true
page_id_prefix = "podman"
page_size = 7
poll_interval_ms = 500
cpu_history_len = 30
log_command = ["podman", "logs", "-f"]
terminal = ["/usr/bin/x-terminal-emulator"]

