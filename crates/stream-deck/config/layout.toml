
# Stream Deck レイアウト設定 (新スキーマ)

[app]
home = "home"

[dashboard]

[[dashboard.sections]]
type = "cpu"
capacity = 10

[[dashboard.sections]]
type = "mem"
capacity = 30

[[dashboard.sections]]
type = "load"
capacity = 30

[[dashboard.sections]]
type = "notif"
capacity = 12

[[pages]]
id = "home"
title = "Home"

[[pages.items]]
kind = "nav"
label = "Apps"
target = "apps"

[[pages.items]]
kind = "nav"
label = "Podman"
target = "podman"

[[pages.items]]
kind = "nav"
label = "BtnSample"
target = "BtnSample"

[[pages]]
id = "apps"
title = "Apps"

# サブページで左上に戻る操作を置きたい場合は、back を先頭に定義する。
[[pages.items]]
kind = "back"
label = "Back"

[[pages.items]]
kind = "command"
label = "Terminal"
command = ["/usr/bin/terminator"]

[[pages]]
id = "BtnSample"
title = "BtnSample"

[[pages.items]]
kind = "back"
label = "Back"

[[pages.items]]
kind = "sample"
sample_id = "btn_label_only"
label = "Label"

[[pages.items]]
kind = "sample"
sample_id = "btn_label_value"
label = "Value"

[[pages.items]]
kind = "sample"
sample_id = "btn_icon_badge"
label = "Badge"

[[pages.items]]
kind = "sample"
sample_id = "btn_bar_trend"
label = "Trend"

[[pages.items]]
kind = "sample"
sample_id = "btn_error_fallback"
label = "Error"

[display]

[[display.samples]]
id = "btn_label_only"
target = "button"
pattern = "label_only"

[display.samples.payload]
label = "Apps"
bg_color = [30, 80, 160]

[[display.samples]]
id = "btn_label_value"
target = "button"
pattern = "label_value"

[display.samples.payload]
title = "CPU"
value = "27"
unit = "%"
severity = "normal"

[[display.samples]]
id = "btn_icon_badge"
target = "button"
pattern = "icon_badge"

[display.samples.payload]
icon = "bell"
badge_count = 3
status = "warn"

[[display.samples]]
id = "btn_bar_trend"
target = "button"
pattern = "bar_trend"

[display.samples.payload]
current = 62.0
max = 100.0
history = [45.0, 55.0, 62.0, 58.0, 62.0]

[[display.samples]]
id = "btn_error_fallback"
target = "button"
pattern = "error_fallback"

[display.samples.payload]
error_code = "E_CONN"
message = "offline"

[dynamic.podman]
enabled = true
page_id_prefix = "podman"
page_size = 7
poll_interval_ms = 500
cpu_history_len = 30
log_command = ["podman", "logs", "-f"]
terminal = ["/usr/bin/x-terminal-emulator", "-e"]
container_list_poll_interval_ms = 5000

[dynamic.podman.colors]
running = [0, 180, 20]
exited = [50, 0, 0]
paused = [200, 160, 0]
other = [80, 80, 80]

