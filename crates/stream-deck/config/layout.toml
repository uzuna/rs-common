
# Stream Deck レイアウト設定 (新スキーマ)

[app]
home = "home"

[dashboard]

[[dashboard.sections]]
type = "cpu"
capacity = 30

[[dashboard.sections]]
type = "mem"
capacity = 30

[[dashboard.sections]]
type = "load"
capacity = 30

[[dashboard.sections]]
type = "notif"
capacity = 12

[[pages]]
id = "home"
title = "Home"
# canonical_layout: nav_reserved (StreamDeck Plus 4×2)
# ANCHOR_BACK:      なし（トップページのため不要）
# ANCHOR_HOME:      なし（自己遷移のため非表示）
# ANCHOR_PREV/NEXT: encoder 0 がページグループ内移動を担当（将来拡張時に有効化）
# content_band:     PRIMARY_1=Apps, PRIMARY_2=Podman, PRIMARY_3=BtnSample

[[pages.items]]
kind = "nav"
label = "Apps"
target = "apps"
priority = 10     # PRIMARY_1 → ボタン 0

[[pages.items]]
kind = "nav"
label = "Podman"
target = "podman"
priority = 20     # PRIMARY_2 → ボタン 1

[[pages.items]]
kind = "nav"
label = "BtnSample"
target = "BtnSample"
priority = 30     # PRIMARY_3 → ボタン 2

[[pages]]
id = "apps"
title = "Apps"
# canonical_layout: nav_reserved
# ANCHOR_BACK: priority=-100 → ボタン 0 (左上固定)
# content_band: PRIMARY_1=Terminal

[[pages.items]]
kind = "back"
label = "Back"
priority = -100   # ANCHOR_BACK → ボタン 0 (左上)

[[pages.items]]
kind = "command"
label = "Terminal"
command = ["/usr/bin/terminator"]
priority = 10     # PRIMARY_1 → ボタン 1

[[pages]]
id = "BtnSample"
title = "BtnSample"
# canonical_layout: nav_reserved
# ANCHOR_BACK: priority=-100 → ボタン 0 (左上固定)
# content_band: PRIMARY_1..7 = サンプル 7 種（button/section 混在）

[[pages.items]]
kind = "back"
label = "Back"
priority = -100   # ANCHOR_BACK → ボタン 0 (左上)

[[pages.items]]
kind = "sample"
sample_id = "btn_label_only"
label = "Label"
priority = 10     # PRIMARY_1

[[pages.items]]
kind = "sample"
sample_id = "btn_label_value"
label = "Value"
action_ref = "act_btnsample_mode"
priority = 20     # PRIMARY_2

[[pages.items]]
kind = "sample"
sample_id = "btn_icon_badge"
label = "Badge"
action_ref = "act_btnsample_set_50"
priority = 30     # PRIMARY_3

[[pages.items]]
kind = "sample"
sample_id = "btn_bar_trend"
label = "Trend"
action_ref = "act_btnsample_value_up"
priority = 40     # PRIMARY_4

[[pages.items]]
kind = "sample"
sample_id = "btn_error_fallback"
label = "Error"
action_ref = "act_btnsample_value_down"
priority = 50     # PRIMARY_5

[[pages.items]]
kind = "sample"
sample_id = "sec_label_value"
label = "SecValue"
action_ref = "act_btnsample_sec_mode"
priority = 60     # PRIMARY_6

[[pages.items]]
kind = "sample"
sample_id = "sec_bar_trend"
label = "SecTrend"
priority = 70     # PRIMARY_7

[[actions]]
kind = "transition"
id = "act_btnsample_mode"
states = ["idle", "active", "paused"]
initial_state = "idle"

[[actions]]
kind = "set_value"
id = "act_btnsample_value_up"
min = 0
max = 100
initial = 20
step = 20
operation = "increment"
wrap = true

[[actions]]
kind = "set_value"
id = "act_btnsample_value_down"
min = 0
max = 100
initial = 20
step = 20
operation = "decrement"
wrap = true

[[actions]]
kind = "set_value"
id = "act_btnsample_set_50"
min = 0
max = 100
initial = 20
operation = "set"
set_value = 50

[[actions]]
kind = "transition"
id = "act_btnsample_sec_mode"
states = ["sec_idle", "sec_watch", "sec_alert"]
initial_state = "sec_idle"

[display]

[[display.samples]]
id = "btn_label_only"
target = "button"
pattern = "label_only"

[display.samples.payload]
label = "Apps"
bg_color = [30, 80, 160]

[[display.samples]]
id = "btn_label_value"
target = "button"
pattern = "label_value"

[display.samples.payload]
title = "CPU"
value = "27"
unit = "%"
severity = "normal"

[[display.samples]]
id = "btn_icon_badge"
target = "button"
pattern = "icon_badge"

[display.samples.payload]
icon = "bell"
badge_count = 3
status = "warn"

[[display.samples]]
id = "btn_bar_trend"
target = "button"
pattern = "bar_trend"

[display.samples.payload]
current = 62.0
max = 100.0
history = [45.0, 55.0, 62.0, 58.0, 62.0]

[[display.samples]]
id = "btn_error_fallback"
target = "button"
pattern = "error_fallback"

[display.samples.payload]
error_code = "E_CONN"
message = "offline"

[[display.samples]]
id = "sec_label_value"
target = "section"
pattern = "label_value"

[display.samples.payload]
title = "SecCPU"
value = "42"
unit = "%"
severity = "warn"

[[display.samples]]
id = "sec_bar_trend"
target = "section"
pattern = "bar_trend"

[display.samples.payload]
current = 68.0
max = 100.0
history = [22.0, 35.0, 48.0, 56.0, 68.0]

[dynamic.podman]
enabled = true
page_id_prefix = "podman"
page_size = 7
poll_interval_ms = 500
cpu_history_len = 30
log_command = ["podman", "logs", "-f"]
terminal = ["/usr/bin/x-terminal-emulator", "-e"]
container_list_poll_interval_ms = 5000

[dynamic.podman.colors]
running = [0, 180, 20]
exited = [50, 0, 0]
paused = [200, 160, 0]
other = [80, 80, 80]

