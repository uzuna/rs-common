
# Stream Deck レイアウト設定
#
# 各セクションは [[layout.sections]] テーブルで宣言します。
# type     : セクション種別 (cpu | mem | load | bright | notif)
# capacity : 履歴バー本数  (省略時はデフォルト値が使われます)

[[layout.sections]]
type = "cpu"
capacity = 10

[[layout.sections]]
type = "mem"
capacity = 30

[[layout.sections]]
type = "load"
capacity = 30

[[layout.sections]]
type = "cpu"
capacity = 50
